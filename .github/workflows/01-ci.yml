name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main

  # Allow the workflow to be triggered manually
  workflow_dispatch:

jobs:

  # =========================================================
  # Terraform Infrastructure Validation
  # =========================================================
  terraform-check:
    name: Terraform Infrastructure Validation
    runs-on: ubuntu-latest

    env:
      TF_VAR_resource_group_name: "s224868878-week08-rg"
      TF_VAR_acr_name: "s224868878w08acr"
      TF_VAR_storage_account_name: "s224868878w08storage"
      TF_VAR_aks_cluster_name: "s224868878-week08-aks"
      TF_VAR_aks_dns_prefix: "s224868878-week08"
      TF_VAR_aks_node_count: "3"
      TF_VAR_environment: "week08"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Security Scan and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # Infrastructure validation and application tests must pass first
    needs:
      - terraform-check
      - backend-test

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the image locally on the GitHub Actions runner
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # Authenticate Docker Hub using repository secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Install Docker Scout on the GitHub Actions runner
      - name: Install Docker Scout
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      # Security gate: stop the pipeline if Critical vulnerabilities are found
      - name: Docker Scout Vulnerability Scan
        run: |
          docker scout cves \
            --only-severity critical \
            --exit-code \
            ${{ matrix.image }}:${{ github.sha }}

      # Azure authentication occurs only after security scanning succeeds
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      # Tag the successfully scanned image for Azure Container Registry
      - name: Tag Docker image for ACR
        run: |
          docker tag \
            ${{ matrix.image }}:${{ github.sha }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}